<rect x="448" y="129" width="525" height="100" rx="6" class="obs"/><text x="462" y="154" class="title">Cascade</text><text x="570" y="154" class="s">primary → judge → accept</text><text x="570" y="177" class="sm">今回：最終ソースは primary</text><text x="570" y="205" class="sm">reject → repair は条件付き（今回は未観測）</text>
