<rect x="18" y="145" width="374" height="90" rx="7" class="unknown"/><text x="33" y="171" class="s" font-weight="bold">判定失敗・実行失敗</text><text x="33" y="194" class="sm">fallback / 縮退：IssueとSDK型に記載</text><text x="33" y="216" class="sm">今回の実行では未再現</text>
