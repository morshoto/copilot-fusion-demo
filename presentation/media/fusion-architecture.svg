<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#777"/></marker></defs>
<style>text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#1b1b1b}.title{font-weight:800;font-size:20px}.s{font-size:15px}.sm{font-size:13px;fill:#555}.tag{font-size:13px;font-weight:800;fill:#b7202c}.obs{fill:#edf7f4;stroke:#15846b;stroke-width:2}.spec{fill:#fff;stroke:#aaa;stroke-width:1.5}.unknown{fill:#fff8f7;stroke:#c75c60;stroke-width:1.5;stroke-dasharray:6 4}.arrow{fill:none;stroke:#777;stroke-width:2;marker-end:url(#a)}.group{fill:#fafafa;stroke:#bbb;stroke-width:1.5}</style>
