<path d="M163 72 H197" class="arrow"/><rect x="201" y="19" width="190" height="105" rx="7" class="obs"/><text x="215" y="43" class="title">ルート決定</text><text x="215" y="68" class="s">開始 → resolved</text><text x="215" y="91" class="sm">今回 capi_plan を観測</text><text x="215" y="111" class="sm">判断基準は非公開</text>
