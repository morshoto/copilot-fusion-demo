name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Demo tests and typecheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: fusion-demo/pnpm-lock.yaml
      - run: node --test tests/workflow-contract.test.mjs
      - run: node --test tests/milestone-sync.test.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: fusion-demo
      - run: pnpm test
        working-directory: fusion-demo
      - run: pnpm typecheck
        working-directory: fusion-demo
