name: Security
on:
  push:
    branches: ['**']
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
permissions:
  contents: read
jobs:
  codeql:
    if: ${{ github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  deep-validation:
    name: Full security and integration validation
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: fusion-demo/pnpm-lock.yaml
      - run: node --test tests/workflow-contract.test.mjs
      - run: node --test tests/milestone-sync.test.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: fusion-demo
      - run: pnpm test
        working-directory: fusion-demo
      - run: pnpm typecheck
        working-directory: fusion-demo
  pull-request-policy:
    name: Evaluate CodeQL policy for pull requests
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - run: node .github/codeql/post-codeql-policy-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  report-failure:
    needs: [codeql, deep-validation]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (needs.codeql.result == 'failure' || needs.codeql.result == 'cancelled' ||
           needs.deep-validation.result == 'failure' || needs.deep-validation.result == 'cancelled') }}
    runs-on: ubuntu-latest
    concurrency:
      group: security-ci-failure-issue
      queue: max
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node .github/codeql/report-security-failure.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEEP_RESULT: ${{ needs.deep-validation.result }}
          CONSUMER_RESULT: skipped
