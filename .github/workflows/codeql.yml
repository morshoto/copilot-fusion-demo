name: CodeQL
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:
    inputs:
      swift_only:
        type: boolean
        default: false
      scan_ref:
        type: string
        default: ''
      scan_sha:
        type: string
        default: ''
      profile_swift:
        type: boolean
        default: false
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsupported Swift-only scan
        if: ${{ inputs.swift_only }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.scan_sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:javascript-typescript
          wait-for-processing: true
